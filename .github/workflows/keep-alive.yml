name: Keep Supabase alive

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the REST API
        env:
          URL: ${{ secrets.VITE_SUPABASE_PROJECT_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -fsS "$URL/rest/v1/roles?select=id&limit=1" -H "apikey: $KEY"
